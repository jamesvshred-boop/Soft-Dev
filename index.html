<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
        h1 { color: #333; }
        #todo-form { margin-bottom: 20px; }
        input[type="text"], input[type="date"], input[type="tel"], input[type="time"], textarea, input[type="text"].address { padding: 8px; width: 250px; margin-right: 8px; }
        select { padding: 8px; margin-right: 8px; }
        button { padding: 8px 12px; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; margin-bottom: 8px; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; }
        .task-main { display: flex; justify-content: space-between; align-items: center; }
        .task-details { font-size: 0.95em; color: #555; margin-top: 4px; }
        .remove-btn { background: #e74c3c; color: #fff; border: none; padding: 6px 10px; border-radius: 3px; cursor: pointer; margin-left: 8px; }
        .finished-btn { background: #27ae60; color: #fff; border: none; padding: 6px 10px; border-radius: 3px; cursor: pointer; margin-left: 8px; }
        .priority-btn { background: #2ecc40; color: #fff; border: none; padding: 6px 10px; border-radius: 3px; cursor: pointer; margin-left: 8px; }
        .priority { border: 2px solid #2ecc40 !important; }
        textarea { vertical-align: top; width: 250px; height: 40px; margin-right: 8px; }
        .tab-title { margin-top: 32px; color: #444; }
        a.address-link { color: #2980b9; text-decoration: underline; }
        a.phone-link { color: #27ae60; text-decoration: underline; }
        .distance { color: #888; font-size: 0.9em; margin-left: 8px; }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <form id="todo-form">
        <input type="text" id="name-input" placeholder="Name" required>
        <input type="text" id="todo-input" placeholder="Task Title" required>
        <textarea id="desc-input" placeholder="Description"></textarea>
        <select id="category-input">
            <option value="">Category</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Talk to">Talk to</option>
        </select>
        <input type="date" id="due-date-input" placeholder="Due Date">
        <input type="time" id="time-input" placeholder="Time">
        <input type="text" id="address-input" class="address" placeholder="Address">
        <input type="tel" id="phone-input" placeholder="Phone Number">
        <button type="submit">Add</button>
    </form>
    <div>
        <h2 class="tab-title">Active Tasks</h2>
        <ul id="todo-list"></ul>
    </div>
    <div>
        <h2 class="tab-title">Talk To</h2>
        <ul id="talkto-list"></ul>
    </div>
    <div>
        <h2 class="tab-title">Finished Tasks</h2>
        <ul id="finished-list"></ul>
    </div>

    <script>
        let userLat = null;
        let userLng = null;

        // Get user's location
        function updateLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    updateAllDistances();
                });
            }
        }

        // Haversine formula
        function haversine(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            const R = 3958.8; // miles
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Geocode address using OpenStreetMap Nominatim
        async function getLatLng(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                }
            } catch (e) {}
            return null;
        }

        // Add distance span to address element
        async function addDistanceSpan(addressElem, address) {
            if (!address || !userLat || !userLng) {
                addressElem.querySelector('.distance').textContent = '';
                return;
            }
            const coords = await getLatLng(address);
            if (coords) {
                const dist = haversine(userLat, userLng, coords.lat, coords.lon);
                addressElem.querySelector('.distance').textContent = `(${dist.toFixed(2)} miles away)`;
            } else {
                addressElem.querySelector('.distance').textContent = '(N/A)';
            }
        }

        // Update all distances
        function updateAllDistances() {
            document.querySelectorAll('.address-link').forEach(function(link) {
                const address = link.getAttribute('data-address');
                addDistanceSpan(link.parentElement, address);
            });
        }

        // Update location every 3 minutes
        setInterval(updateLocation, 180000);
        updateLocation();

        const form = document.getElementById('todo-form');
        const nameInput = document.getElementById('name-input');
        const input = document.getElementById('todo-input');
        const descInput = document.getElementById('desc-input');
        const category = document.getElementById('category-input');
        const dueDate = document.getElementById('due-date-input');
        const timeInput = document.getElementById('time-input');
        const address = document.getElementById('address-input');
        const phone = document.getElementById('phone-input');
        const todoList = document.getElementById('todo-list');
        const finishedList = document.getElementById('finished-list');
        const talktoList = document.getElementById('talkto-list');

        function makeAddressTag(addr) {
            if (!addr) return 'N/A';
            const encoded = encodeURIComponent(addr);
            return `<span>
                <a href="https://www.google.com/maps/search/?api=1&query=${encoded}" target="_blank" class="address-link" data-address="${addr}">${addr}</a>
                <span class="distance"></span>
            </span>`;
        }

        function makePhoneTag(ph) {
            if (!ph) return 'N/A';
            return `<a href="tel:${ph}" class="phone-link">${ph}</a>`;
        }

        function addTaskToList(li, list, isPriority) {
            if (isPriority) {
                li.classList.add('priority');
                list.insertBefore(li, list.firstChild);
            } else {
                list.appendChild(li);
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = nameInput.value.trim();
            const task = input.value.trim();
            const desc = descInput.value.trim();
            const cat = category.value;
            const date = dueDate.value;
            const time = timeInput.value;
            const addr = address.value.trim();
            const ph = phone.value.trim();

            if (name && task) {
                const li = document.createElement('li');
                const mainDiv = document.createElement('div');
                mainDiv.className = 'task-main';
                mainDiv.textContent = `${task} (by ${name})`;

                const removeBtn = document.createElement('button');
                removeBtn.textContent = 'Remove';
                removeBtn.className = 'remove-btn';
                removeBtn.onclick = () => li.remove();
                mainDiv.appendChild(removeBtn);

                const finishedBtn = document.createElement('button');
                finishedBtn.textContent = 'Finish';
                finishedBtn.className = 'finished-btn';
                finishedBtn.onclick = () => {
                    li.remove();
                    const finishedLi = document.createElement('li');
                    finishedLi.innerHTML = `
                        <strong>${task}</strong> (by ${name}) - Finished
                        <div class="task-details">
                            <strong>Description:</strong> ${desc || 'N/A'}<br>
                            <strong>Category:</strong> ${cat || 'N/A'} |
                            <strong>Due:</strong> ${date || 'N/A'} ${time || ''} |
                            <strong>Address:</strong> ${makeAddressTag(addr)} |
                            <strong>Phone:</strong> ${makePhoneTag(ph)}
                        </div>
                    `;
                    finishedList.appendChild(finishedLi);
                    updateAllDistances();
                };
                mainDiv.appendChild(finishedBtn);

                const priorityBtn = document.createElement('button');
                priorityBtn.textContent = 'Priority';
                priorityBtn.className = 'priority-btn';
                priorityBtn.onclick = () => {
                    if (li.classList.contains('priority')) {
                        li.classList.remove('priority');
                        priorityBtn.textContent = 'Priority';
                        // Move to bottom of the list
                        const parentList = li.parentElement;
                        parentList.appendChild(li);
                    } else {
                        li.classList.add('priority');
                        priorityBtn.textContent = 'Unmark Priority';
                        // Move to top of the list
                        const parentList = li.parentElement;
                        parentList.insertBefore(li, parentList.firstChild);
                    }
                };
                mainDiv.appendChild(priorityBtn);

                li.appendChild(mainDiv);

                const details = document.createElement('div');
                details.className = 'task-details';
                details.innerHTML = `
                    <strong>Description:</strong> ${desc || 'N/A'}<br>
                    <strong>Category:</strong> ${cat || 'N/A'} |
                    <strong>Due:</strong> ${date || 'N/A'} ${time || ''} |
                    <strong>Address:</strong> ${makeAddressTag(addr)} |
                    <strong>Phone:</strong> ${makePhoneTag(ph)}
                `;
                li.appendChild(details);

                if (cat === "Talk to") {
                    addTaskToList(li, talktoList, false);
                } else {
                    addTaskToList(li, todoList, false);
                }

                updateAllDistances();

                nameInput.value = '';
                input.value = '';
                descInput.value = '';
                category.value = '';
                dueDate.value = '';
                timeInput.value = '';
                address.value = '';
                phone.value = '';
            }
        });
    </script>
</body>
</html>
